name: Publish to Maven Central

# Publishes the SDK to Maven Central (OSSRH) when a version tag is pushed, e.g. `v1.0.0`.
# Requires GitHub repository secrets:
#   OSSRH_USERNAME  — Maven Central / Sonatype OSSRH username
#   OSSRH_PASSWORD  — OSSRH token/password
#   GPG_PRIVATE_KEY — ASCII-armored GPG private key (export -a)
#   GPG_PASSPHRASE  — passphrase for the above key
on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Deploy
        run: mvn -q -B -P release clean deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
