name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 8, 11, 17 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test (unit + embedded contract tests)
        run: mvn -q -B clean verify

      - name: Async caller-latency benchmark (reported, not asserted)
        if: matrix.java == 17
        run: |
          mvn -q -B org.codehaus.mojo:exec-maven-plugin:3.1.0:java \
            -Dexec.mainClass=com.softino.notifier.AsyncBenchmark \
            -Dexec.classpathScope=test | tee target/async-benchmark.txt

      - name: Upload surefire reports and benchmark
        if: failure() || matrix.java == 17
        uses: actions/upload-artifact@v4
        with:
          name: test-and-benchmark-reports-jdk${{ matrix.java }}
          path: |
            target/surefire-reports
            target/async-benchmark.txt
          if-no-files-found: ignore
